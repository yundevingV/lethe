name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Version
        id: meta
        run: echo "version=$(grep '^version = ' Cargo.toml | sed -E 's/version = \"(.*)\"/\\1/')" >> "$GITHUB_OUTPUT"
      - name: Build app, pkg, dmg, zip
        run: |
          chmod +x scripts/*.sh
          ./scripts/pkg.sh
          ./scripts/dmg.sh
          zip -r Lethe-macOS-arm64.zip Lethe.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Lethe-${{ steps.meta.outputs.version }}.pkg
            Lethe-${{ steps.meta.outputs.version }}.dmg
            Lethe-macOS-arm64.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Zip exe
        shell: pwsh
        run: Compress-Archive -Path target/release/Lethe.exe -DestinationPath Lethe-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Lethe-Windows-x64.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: meta
        run: echo "version=$(grep '^version = ' Cargo.toml | sed -E 's/version = \"(.*)\"/\\1/')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Lethe-${{ steps.meta.outputs.version }}.pkg
            dist/Lethe-${{ steps.meta.outputs.version }}.dmg
            dist/Lethe-macOS-arm64.zip
            dist/Lethe-Windows-x64.zip
